name: Release

# Builds the .vsix and publishes it as a GitHub release, with the notes of its version in
# CHANGELOG.md. Runs when a v* tag is pushed, or by hand (Actions → Release → Run workflow) with the
# tag to create and, optionally, the commit to build; the tag is then created on that commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release, for example v0.6.0 (must match the version in package.json)
        required: true
      ref:
        description: Commit or branch to build and tag (empty = the branch the workflow runs on)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release notes come from the CHANGELOG.md of the branch the workflow runs on, so they can
      # be corrected after the release commit.
      - uses: actions/checkout@v4
        with:
          path: notes
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Check the version
        working-directory: build
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json has version $version, which does not match the tag $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: build
      - run: npm run typecheck
        working-directory: build
      - run: npm test
        working-directory: build
      - run: npm run package
        working-directory: build
      - name: Release notes
        run: |
          awk -v v="$VERSION" '/^## /{ if (found) exit; if ($2 == v) { found = 1; next } } found' \
            notes/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          # Relative links of the change log point to the files of the release on GitHub.
          sed -i -E "s#\]\(((docs|images)/[^)]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/\1)#g" release-notes.md
          cat release-notes.md
      - name: Create the release
        run: |
          gh release create "$TAG" "build/vscode-fhir-connect-$VERSION.vsix" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file release-notes.md
